<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Saturn's Bookshelf — a small collection of books worth reading." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#2a1810" />
  <title>Saturn's Bookshelf</title>

  <!-- Open Graph (Facebook, iMessage, Slack, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Saturn's Bookshelf" />
  <meta property="og:site_name" content="Saturn's Bookshelf" />
  <meta property="og:description" content="A small collection of books worth reading." />
  <meta property="og:url" content="https://books222read.netlify.app/" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Saturn's Bookshelf" />
  <meta name="twitter:description" content="A small collection of books worth reading." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-top: #3a2418;
      --bg-bottom: #1a0f08;
      --wood: #4a2e1e;
      --wood-light: #5a3a26;
      --gold: #d4a574;
      --gold-soft: #e8c89a;
      --ink: #f5ecdf;
      --ink-dim: rgba(245, 236, 223, 0.7);
      --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.35);
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, var(--bg-top) 0%, var(--bg-bottom) 70%),
        var(--bg-bottom);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header {
      text-align: center;
      padding: 3.5rem 1.5rem 1rem;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
      color: var(--gold-soft);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1.75rem 1.5rem;
      padding-top: 1rem;
    }

    .book {
      all: unset;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: var(--radius);
      transition: transform 0.25s ease;
    }

    .book:hover,
    .book:focus-visible { transform: translateY(-4px); }

    .book:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--wood) 0%, var(--wood-light) 100%);
      box-shadow: var(--shadow-md);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
      display: block;
    }

    .book:hover .book-cover,
    .book:focus-visible .book-cover {
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(232, 200, 154, 0.2);
    }

    .book-title {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      line-height: 1.3;
      color: var(--ink);
      text-align: center;
      font-weight: 500;
    }

    /* Fallback cover when the image fails */
    .book-cover--fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 0.9rem;
      color: var(--gold-soft);
      text-align: center;
      background:
        linear-gradient(135deg, var(--wood) 0%, var(--wood-light) 100%);
    }

    /* Modal viewer */
    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      z-index: 9999;
      animation: fade 0.2s ease-out;
    }

    .viewer[data-open='true'] { display: flex; flex-direction: column; }

    .viewer-topbar {
      display: flex;
      justify-content: flex-end;
      padding: 0.75rem 1rem;
    }

    .close-btn {
      all: unset;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: 1.75rem;
      border-radius: 50%;
      transition: background 0.15s ease;
    }

    .close-btn:hover,
    .close-btn:focus-visible { background: rgba(255, 255, 255, 0.1); }
    .close-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .viewer iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    footer {
      text-align: center;
      color: var(--ink-dim);
      font-size: 0.8rem;
      padding: 0 1.5rem 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Saturn's Bookshelf</h1>
  </header>

  <main>
    <div class="bookshelf" id="bookshelf" role="list"></div>
  </main>

  <footer>Click any book to read.</footer>

  <div
    class="viewer"
    id="viewer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="viewer-title"
    data-open="false"
  >
    <div class="viewer-topbar">
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close reader">&times;</button>
    </div>
    <h2 id="viewer-title" class="visually-hidden" style="position:absolute;left:-9999px;">PDF reader</h2>
    <iframe id="pdfFrame" title="PDF reader" src="about:blank"></iframe>
  </div>

  <script>
    const books = [
      {
        title: 'The Power of Now',
        cover: 'https://covers.openlibrary.org/b/isbn/1577314808-L.jpg',
        pdf: 'pdfs/The Power of Now.pdf'
      },
      {
        title: 'The Creative Act',
        cover: 'https://covers.shakespeareandcompany.com/97818388/9781838858636.jpg',
        pdf: 'pdfs/The Creative Act.pdf'
      },
      {
        title: 'The 7 Habits of Highly Effective People',
        cover: 'https://covers.openlibrary.org/b/isbn/0743269519-L.jpg',
        pdf: 'pdfs/The 7 Habits of Highly Effective People.pdf'
      },
      {
        title: 'Mental Chemistry',
        cover: 'https://m.media-amazon.com/images/I/61TB4SD55uL._AC_UF1000,1000_QL80_.jpg',
        pdf: 'pdfs/Mental Chemistry.pdf'
      },
      {
        title: 'The Richest Man in Babylon',
        cover: 'https://covers.openlibrary.org/b/isbn/0451205367-L.jpg',
        pdf: 'pdfs/The Richest Man in Babylon.pdf'
      },
      {
        title: 'The Science of Getting Rich',
        cover: 'https://i.ebayimg.com/images/g/cHkAAOSwTTlgAERy/s-l1200.jpg',
        pdf: 'pdfs/The science of getting rich.pdf'
      },
      {
        title: 'The Master Key System',
        cover: 'https://m.media-amazon.com/images/I/61Kr6CqMGZL._AC_UF1000,1000_QL80_.jpg',
        pdf: 'pdfs/The Master Key System.pdf'
      }
    ];

    // --- helpers ---
    const $ = (id) => document.getElementById(id);
    const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/');
    const isMobile = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const escapeHtml = (s) =>
      s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // --- render shelf ---
    const shelf = $('bookshelf');
    shelf.innerHTML = books
      .map((book, i) => `
        <button class="book" type="button" role="listitem" data-index="${i}" aria-label="Open ${escapeHtml(book.title)}">
          <img
            class="book-cover"
            src="${book.cover}"
            alt="${escapeHtml(book.title)} cover"
            loading="lazy"
            decoding="async"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'book-cover book-cover--fallback',textContent:${JSON.stringify(book.title)}}))"
          />
          <span class="book-title">${escapeHtml(book.title)}</span>
        </button>
      `)
      .join('');

    // --- viewer logic ---
    const viewer = $('viewer');
    const frame = $('pdfFrame');
    const closeBtn = $('closeBtn');
    let lastFocused = null;

    function openBook(book, trigger) {
      const url = encodePath(book.pdf);
      if (isMobile()) {
        // iOS Safari can't render PDFs inside an iframe reliably — open natively
        window.open(url, '_blank', 'noopener');
        return;
      }
      lastFocused = trigger || document.activeElement;
      frame.src = url;
      viewer.dataset.open = 'true';
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function closeBook() {
      viewer.dataset.open = 'false';
      frame.src = 'about:blank';
      document.body.style.overflow = '';
      if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    }

    shelf.addEventListener('click', (e) => {
      const btn = e.target.closest('.book');
      if (!btn) return;
      const book = books[Number(btn.dataset.index)];
      if (book) openBook(book, btn);
    });

    closeBtn.addEventListener('click', closeBook);

    // click the dark backdrop (but not the iframe) to close
    viewer.addEventListener('click', (e) => {
      if (e.target === viewer) closeBook();
    });

    // escape to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && viewer.dataset.open === 'true') closeBook();
    });
  </script>
</body>
</html>
